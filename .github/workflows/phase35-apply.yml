name: phase35-apply

on:
  push:
    branches:
      - agent/vnext-phase-3-5-stabilization
    paths:
      - .phase35/READY

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/vnext-phase-3-5-stabilization
      - name: Apply and commit Phase 3.5 stabilization
        shell: bash
        run: |
          set -euo pipefail
          cat .phase35/plain.part.* > /tmp/phase35.patch
          printf '%s  %s\n' '721e79203e45b3617ac884acb1f166528c0807d0189198d4554105f79d3796dc' /tmp/phase35.patch | sha256sum -c -
          git apply --check /tmp/phase35.patch
          git apply /tmp/phase35.patch
          rm -rf .phase35
          rm .github/workflows/phase35-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stabilize(polyglot): complete Phase 3.5"
          git push origin HEAD:agent/vnext-phase-3-5-stabilization
