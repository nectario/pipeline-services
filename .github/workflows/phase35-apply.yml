name: phase35-apply

on:
  push:
    branches:
      - agent/vnext-phase-3-5-stabilization
    paths:
      - .phase35/apply.patch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/vnext-phase-3-5-stabilization
      - name: Apply and commit Phase 3.5 stabilization
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .phase35/apply.patch
          git apply .phase35/apply.patch
          rm .phase35/apply.patch
          rm .github/workflows/phase35-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stabilize(polyglot): complete Phase 3.5"
          git push origin HEAD:agent/vnext-phase-3-5-stabilization
