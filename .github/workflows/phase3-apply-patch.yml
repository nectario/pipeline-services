name: phase3-apply-patch

on:
  pull_request:
    paths:
      - .phase3/apply.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Decode, apply, and commit Phase 3 patch
        shell: bash
        run: |
          set -euo pipefail
          payload=.phase3/apply.patch.gz.b64
          if [[ ! -f "$payload" ]]; then
            echo "No patch payload present; nothing to apply."
            exit 0
          fi
          base64 --decode "$payload" | gzip --decompress > /tmp/phase3.patch
          git apply --check /tmp/phase3.patch
          git apply /tmp/phase3.patch
          rm "$payload"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(mojo): complete stable Phase 3 port"
          git push origin HEAD:${{ github.head_ref }}
